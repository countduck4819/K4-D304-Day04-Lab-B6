# starter_v0 — tool declarations.
# Descriptions here document intent + argument conventions so the model routes
# correctly without needing the whole story to be repeated in the system prompt.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Ask the user a follow-up question when a required argument is missing or ambiguous
      (unknown handle, unspecified URL, unclear intent), OR to request explicit user
      confirmation before an outbound action such as `send`. Use response_type="yes_no"
      for confirmations. Do NOT use clarify to answer the user or to summarize results.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "The question shown to the user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text for open input, yes_no for confirmations, choice with options for multiple choice"}
        options: {type: array, default: [], items: {type: string}, description: "Options when response_type=choice"}
      required: [question]

  - name: timeline
    description: >-
      Fetch recent posts from a specific social account. Use ONLY when the user names a
      handle (e.g. "sam altman's tweets", "@openai timeline"). Do NOT use for keyword
      searches across all accounts — use social_search for that. Do NOT use for
      web/news lookups — use lookup for that.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Exact handle without @; required. If the user did not specify a handle, call clarify instead of guessing."}
        limit: {type: integer, default: 5, description: "Number of posts to fetch, 1-50"}
      required: [screenname]

  - name: social_search
    description: >-
      Search recent social posts by keyword/topic across all accounts. Use when the
      user asks "what are people saying about X" or "recent tweets about X". Do NOT
      use for a single named handle — use timeline for that. Do NOT use for web
      articles or news pages — use lookup for that.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Keyword or short phrase to search for"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest = newest first, Top = most engaged"}
        limit: {type: integer, default: 5, description: "Number of posts to return, 1-50"}
      required: [query]

  - name: lookup
    description: >-
      Web/news search across the open internet. Use for articles, news, general
      knowledge lookups, or when the user asks about current events without naming a
      social handle. Set topic="news" for time-sensitive news questions and set
      timeframe accordingly (day/week/month/year). Do NOT use for social media posts
      of a specific handle — use timeline for that.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        topic: {type: string, enum: [general, news], default: "general", description: "Use 'news' for current events/news; 'general' otherwise"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Recency window; match the user's stated time horizon"}
        max_results: {type: integer, default: 5, description: "Number of results, 1-10"}
      required: [query]

  - name: fetch
    description: >-
      Retrieve the readable content of a specific URL the user has explicitly given.
      Do NOT call fetch on a URL you invented or guessed. If the user mentioned "this
      article" or "the page" without providing a URL, call clarify first.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Full http(s) URL provided by the user"}
      required: [url]

  - name: format
    description: >-
      Render a list of already-collected items into a readable markdown digest. Only
      call after other tools have produced the items. This is a presentation tool, not
      a search tool.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items to render, typically produced by lookup/timeline/social_search/fetch"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Presentation style"}
        headline: {type: string, default: "", description: "Optional overall headline"}
      required: [items, template]

  - name: wiki
    description: >-
      Look up a concise Wikipedia summary for stable, encyclopedic knowledge
      (definitions, biographies, concept overviews, historical facts). Prefer this
      over `lookup` when the user asks "what is X" / "who is X" / "background on X"
      and the answer is not time-sensitive. Do NOT use for current news or events —
      use `lookup` with topic="news" for that. Do NOT use when the user has given an
      explicit URL — use `fetch` for that.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic or entity to look up"}
        lang: {type: string, default: "en", description: "Wikipedia language edition, e.g. en, vi, fr"}
        sentences: {type: integer, default: 3, description: "Sentences to keep from the summary extract, 1-8"}
      required: [query]

  - name: hackernews
    description: >-
      Search stories on Hacker News via the Algolia API. Use when the user asks
      specifically about Hacker News ("on HN", "what's on Hacker News", "HN
      discussion of X") or wants the tech-community view on a topic. Do NOT use
      for general web/news lookups — use `lookup` for that. Do NOT use for
      Twitter/X posts — use `social_search` for that.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Keyword; empty query returns current top stories"}
        sort: {type: string, enum: [top, new], default: "top", description: "top = most upvoted matches; new = newest first"}
        limit: {type: integer, default: 5, description: "Number of stories, 1-20"}

  - name: weather
    description: >-
      Get current weather conditions for a location via wttr.in. Use when the user
      asks about the weather, temperature, or current conditions at a specific
      place. Do NOT use for multi-day forecasts or historical weather.
    parameters:
      type: object
      properties:
        location: {type: string, default: "", description: "City name, 'City, Country', airport code, or coordinates"}
        units: {type: string, enum: [metric, imperial], default: "metric", description: "metric = Celsius/km-h; imperial = Fahrenheit"}
      required: [location]

  - name: currency
    description: >-
      Convert an amount between two fiat currencies at the latest mid-market rate.
      Use when the user asks "how much is X USD in VND", "current EUR to JPY
      rate", etc. Do NOT use for crypto (BTC/ETH) or for historical rates on a
      specific past date.
    parameters:
      type: object
      properties:
        amount: {type: number, default: 1.0, description: "Amount in the base currency"}
        base: {type: string, default: "USD", description: "3-letter ISO code of the source currency (e.g. USD, EUR, VND)"}
        target: {type: string, default: "VND", description: "3-letter ISO code of the target currency"}

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Send a text message to the configured Telegram channel. This is an OUTBOUND
      action with side effects. You MUST first call `clarify` with
      response_type="yes_no" to obtain explicit user approval of the exact text.
      Only call `send` with confirmed=true AFTER the user has answered yes in a
      later turn. Never call `send` in the same turn as the user's original
      request.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Exact text to send; must match the text the user just confirmed"}
        confirmed: {type: boolean, default: false, description: "Must be true, and only after the user answered yes to a clarify(yes_no) about the exact text"}
      required: [text]

  - name: policy
    description: "Search internal company policy markdown."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area filter"}
        top_k: {type: integer, default: 3, description: "Number of snippets to return"}
      required: [query]

  - name: papers
    description: "Search arXiv papers by keyword."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        max_results: {type: integer, default: 5, description: "Number of papers"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order"}
      required: [query]

  - name: paper_text
    description: "Download an arXiv PDF and extract its text."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv id or full URL"}
        max_pages: {type: integer, default: 5, description: "Max pages to extract"}
        max_chars: {type: integer, default: 8000, description: "Max characters to return"}
      required: [arxiv_url]
